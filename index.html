<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Stagehand</title>
<meta name="apple-mobile-web-app-title" content="Stagehand">
<style>
  :root { --bg:#0b0b0c; --panel:#141416; --panel2:#1c1c1f; --fg:#f2f2f2; --dim:#7a7a80; --line:#2a2a2e;
    --string:#55555b; --accent:#c6ff3d; --mute:#e5392b; --size:34px; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); touch-action:manipulation;
    font:400 17px/1.4 -apple-system,"Helvetica Neue",sans-serif; -webkit-text-size-adjust:100%; }
  body { display:flex; flex-direction:column; height:100dvh; }
  #scroll { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
  button, input, select, textarea { font:inherit; color:var(--fg); }
  button { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:8px 14px; cursor:pointer; }
  button:active { background:#26262a; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#000; font-weight:600; }
  button.danger { color:var(--mute); }
  button.armed { background:var(--mute); border-color:var(--mute); color:#fff; }

  /* ---------- Kopf ---------- */
  header { flex:none; z-index:5; background:var(--bg); border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 20px 0; }
  .row { display:flex; align-items:center; gap:14px; padding-bottom:10px; }
  header h1 { flex:1; margin:0; font-size:24px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .meta { color:var(--dim); white-space:nowrap; }
  .midi { display:flex; align-items:center; gap:6px; color:var(--dim); white-space:nowrap; max-width:220px; overflow:hidden; }
  .dot { flex:none; width:10px; height:10px; border-radius:50%; background:var(--mute); }
  .dot.on { background:var(--accent); }
  .size { display:none; gap:6px; }
  body[data-page=text]:not(.listing) .size { display:flex; }
  .clickbtn { display:none; align-items:center; gap:8px; padding:8px 12px; color:var(--dim); white-space:nowrap; }
  body[data-page=text]:not(.listing) .clickbtn { display:flex; }
  .clickbtn.on { color:var(--fg); }
  .clickbtn.on b { color:var(--accent); }
  /* Click-Knöpfe leuchten im Beat auf: die Eins in Akzentfarbe, die anderen Schläge gedämpft */
  .flbtn { position:relative; overflow:hidden; }
  .flbtn > span { position:relative; }
  .flbtn .fl { position:absolute; inset:0; opacity:0; background:var(--fg); pointer-events:none; }
  .flbtn.one .fl { background:var(--accent); }
  .flbtn.lit, .flbtn.lit b { color:#000 !important; }
  nav.pages { display:flex; gap:4px; margin:0 -6px; }
  nav.pages button { background:none; border:0; border-bottom:2px solid transparent; border-radius:0; padding:10px 14px 12px;
    font-size:14px; font-weight:600; letter-spacing:.14em; color:var(--dim); }
  nav.pages button.on { color:var(--accent); border-bottom-color:var(--accent); }
  body.listing nav.pages { display:none; }

  .page { display:none; padding:20px 20px 40vh; }
  body:not(.listing)[data-page=text] #pText, body:not(.listing)[data-page=info] #pInfo,
  body:not(.listing)[data-page=chords] #pChords, body:not(.listing)[data-page=tabs] #pTabs,
  body:not(.listing)[data-page=map] #pMap, body:not(.listing)[data-page=click] #pClick { display:block; }

  /* ---------- Songliste ---------- */
  #list { display:none; padding:20px 20px 40px; }
  body.listing #list { display:block; }
  #list a { display:flex; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); color:var(--fg);
    text-decoration:none; font-size:24px; }
  #list a > span:first-child { color:var(--dim); min-width:2em; }
  #list a.active { color:var(--accent); }
  #list a .t { flex:1; min-width:0; }
  #list a .fav { flex:none; margin:-14px 0; padding:0 4px 0 16px; display:flex; align-items:center; font-size:26px; color:#3a3a40; }
  #list a .fav.on { color:#ffc93d; }
  #list .grp { margin:22px 0 2px; font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  #list .grp:first-child { margin-top:0; }
  .tools { display:flex; flex-wrap:wrap; gap:10px; margin:0 0 18px; }
  .hint { color:var(--dim); line-height:1.5; }
  input[type=file] { display:none; }

  /* ---------- TEXT ---------- */
  #pText { font-size:var(--size); line-height:1.35; }
  #pText section { padding:12px 16px; margin:0 0 10px; border-left:4px solid transparent; color:var(--dim);
    transition:color .2s, background .2s; }
  #pText section.current { color:var(--fg); border-left-color:var(--accent); background:var(--panel); }
  .label { font-size:14px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); margin-bottom:6px; }
  #pText section p { margin:0; white-space:pre-wrap; }
  #pText .edited { margin:18px 0 0; font-size:15px; color:var(--dim); }
  #lyrics textarea { min-height:62vh; font-size:20px; line-height:1.45; }
  #lyrics .hint { margin:10px 0 0; font-size:15px; }
  .note { color:var(--dim); font-style:italic; }

  /* ---------- INFO ---------- */
  .facts { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:10px; margin-bottom:28px; }
  .fact { background:var(--panel); border-radius:12px; padding:12px 16px; }
  .cap { display:block; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-bottom:4px; }
  .fact div, .fact input { font-size:22px; }
  .fact input { display:block; width:100%; background:none; border:0; padding:0; outline:none; }
  .fact input.k { font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-bottom:4px; }
  .fact input::placeholder { color:#45454a; }
  .fact.add { background:none; border:2px dashed var(--line); color:var(--dim); font-size:17px; text-align:center; }
  .sketchbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px; }
  .sketchbar .pen { width:36px; height:36px; padding:0; border-radius:50%; border:3px solid var(--bg); outline:1px solid var(--line); }
  .sketchbar .pen.on { outline:2px solid var(--fg); }
  .sketchbar button.on { background:var(--accent); border-color:var(--accent); color:#000; }
  #sketch { display:block; width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px; touch-action:pan-y; }
  #sketch.drawing { touch-action:none; border-color:var(--accent); }
  .field { margin:0 0 26px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip.on { background:var(--accent); border-color:var(--accent); color:#000; }
  select { background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:9px 12px; font-size:17px; }
  .stepper { display:inline-flex; align-items:center; gap:12px; }
  .stepper b { min-width:2.2em; text-align:center; font-size:22px; font-weight:500; }
  textarea { width:100%; min-height:38vh; background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; font-size:20px; line-height:1.5; resize:vertical; }

  /* ---------- SONGMAP ---------- */
  .mapbar { display:flex; gap:3px; height:64px; margin:0 0 8px; }
  .mapbar a { min-width:0; border-radius:8px; padding:8px 8px 0; color:#000; text-decoration:none; overflow:hidden;
    font-size:15px; font-weight:700; line-height:1.15; white-space:nowrap; text-overflow:ellipsis; }
  .mapbar a small { display:block; font-weight:500; opacity:.7; }
  .maptotal { color:var(--dim); font-size:15px; margin:0 0 22px; }
  .maptotal b { color:var(--fg); font-weight:600; }
  .part { display:flex; background:var(--panel); border-radius:14px; margin:0 0 10px; overflow:hidden; }
  .part .clr { flex:none; width:8px; }
  .part .body { flex:1; min-width:0; padding:10px 14px 12px; display:flex; flex-direction:column; gap:8px; }
  .part .top { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; }
  .part input { background:none; border:0; border-bottom:1px solid transparent; padding:4px 2px; outline:none; min-width:0; }
  .part input:focus { border-bottom-color:var(--line); }
  .part input.nm { flex:1 1 160px; font-size:24px; font-weight:600; }
  .part input.ch { font-size:20px; }
  .part input.nt { font-size:17px; color:var(--dim); }
  .part .stepper b { min-width:0; font-size:18px; white-space:nowrap; }
  .part .stepper button, .part .mv button { padding:6px 12px; font-size:16px; }
  .part .mv { display:flex; gap:6px; }
  .cpick { flex:none; width:36px; height:36px; border-radius:50%; border:2px solid var(--line); overflow:hidden; cursor:pointer; }
  .cpick input { opacity:0; width:100%; height:100%; border:0; padding:0; cursor:pointer; }
  .part .cstd { padding:6px 10px; font-size:14px; color:var(--dim); }
  /* Abspielen zum Prüfen: Song-Audio + Click über der Songmap */
  body:not(.listing)[data-page=map] #pMap { display:flex; flex-direction:column; min-height:100%; padding-bottom:0; }
  .mapbody { flex:1; padding-bottom:30px; }
  .mplayer { position:sticky; bottom:0; z-index:3; margin:0 -20px; padding:12px 20px calc(env(safe-area-inset-bottom) + 12px);
    background:var(--panel); border-top:1px solid var(--line); box-shadow:0 -10px 30px rgba(0,0,0,.55);
    display:flex; flex-direction:column; gap:10px; }
  .mplayer .tr { display:flex; align-items:center; gap:10px; }
  .mplayer .tr > button { height:52px; padding:0 16px; font-size:18px; font-weight:600; white-space:nowrap; }
  .mplayer .play { min-width:130px; }
  .mplayer .now { flex:1; min-width:0; display:flex; flex-direction:column; padding-left:6px; }
  .mplayer .now .pos { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mplayer .more { min-width:52px; font-size:22px; }
  .mplayer .extra { display:none; flex-wrap:wrap; align-items:center; gap:10px 14px; padding-top:4px; }
  .mplayer.open .extra { display:flex; }
  .mplayer.open .more { background:var(--panel2); border-color:var(--fg); }
  .mplayer .seek { width:100%; height:30px; margin:0; accent-color:var(--accent); }
  .plmap { touch-action:pan-y; }
  .mplayer .t { font-variant-numeric:tabular-nums; color:var(--dim); }
  .mplayer .pos { font-size:19px; font-weight:600; }
  .mplayer button.on:not(.lit) { background:var(--accent); border-color:var(--accent); color:#000; font-weight:600; }
  .mplayer .hint { flex-basis:100%; margin:0; font-size:14px; }
  .mplayer .shift { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
  .mplayer .shift b { min-width:5.2em; text-align:center; font-variant-numeric:tabular-nums; font-weight:600; }
  .plmap { position:relative; }
  .plmap .head { position:absolute; top:-5px; bottom:-5px; width:3px; margin-left:-1px; background:#fff; border-radius:2px;
    box-shadow:0 0 0 2px #000; pointer-events:none; }
  .part.playing { outline:2px solid var(--fg); }
  .bars div.now { outline:3px solid var(--fg); outline-offset:-1px; }
  .bars div[data-bar] { cursor:pointer; }
  .mapgrid .lab { cursor:pointer; display:flex; align-items:baseline; gap:10px; margin:18px 0 8px; font-size:20px; font-weight:700; }
  .mapgrid .lab small { color:var(--dim); font-size:15px; font-weight:500; }
  .mapgrid .lab .nt { color:var(--dim); font-size:15px; font-weight:400; }
  .bars { display:grid; grid-template-columns:repeat(8, 1fr); gap:6px; }
  @media (max-width:600px) { .bars { grid-template-columns:repeat(4, 1fr); } }
  .bars div { position:relative; height:64px; border-radius:8px; border-top:4px solid; display:flex; align-items:center;
    justify-content:center; font-size:20px; font-weight:600; }
  .bars div small { position:absolute; left:7px; top:4px; font-size:11px; font-weight:500; color:var(--dim); }
  .bars .again { grid-column:1 / -1; height:auto; border:0; justify-content:flex-start; font-size:12px; font-weight:500;
    color:var(--dim); letter-spacing:.12em; text-transform:uppercase; margin:4px 0 0; }

  /* ---------- CLICK ---------- */
  .ckbeats { display:flex; gap:10px; height:min(34vh, 300px); margin:0 0 12px; }
  .ckbeats div { flex:1; min-width:0; border-radius:16px; background:var(--panel); display:flex; align-items:center;
    justify-content:center; font-size:clamp(28px, 7vw, 76px); font-weight:700; color:#3a3a40; }
  .ckbeats div.hit { background:var(--fg); color:#000; box-shadow:0 0 40px rgba(255,255,255,.25); }
  .ckbeats div.hit.one { background:var(--accent); box-shadow:0 0 50px rgba(198,255,61,.45); }
  .cksweep { position:relative; height:6px; border-radius:3px; background:var(--panel); margin:0 0 26px; overflow:hidden; }
  .cksweep i { position:absolute; left:0; top:0; bottom:0; width:0; background:var(--dim); border-radius:3px; }
  .ckinfo { display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px 34px; margin:0 0 24px; }
  .ckinfo .bpm { font-size:clamp(56px, 11vw, 110px); font-weight:700; line-height:.9; font-variant-numeric:tabular-nums; }
  .ckinfo .bpm small { font-size:20px; font-weight:500; color:var(--dim); margin-left:8px; }
  .ckinfo .v { font-size:30px; font-weight:600; font-variant-numeric:tabular-nums; }
  .ckmap { position:relative; }
  .ckmap .head { position:absolute; top:-6px; bottom:-6px; width:3px; margin-left:-1px; background:#fff; border-radius:2px;
    box-shadow:0 0 0 2px #000; }
  .cknow { display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 18px; margin:0 0 26px; }
  .cknow b { font-size:34px; }
  .cknow span { font-size:20px; color:var(--dim); }
  .cknow .nx { color:var(--fg); }
  .ckctl { display:flex; flex-wrap:wrap; gap:10px; margin:0 0 14px; }
  .ckctl button { font-size:20px; padding:14px 22px; border-radius:14px; }
  .ckctl button.tap { flex:1 1 200px; font-weight:700; letter-spacing:.1em; }
  .ckctl button.tap:active { background:var(--accent); color:#000; }
  .ckctl button:disabled { opacity:.35; }
  .ckctl .seg { margin-left:auto; }
  .ckctl label { display:flex; align-items:center; gap:10px; color:var(--dim); font-size:15px; }
  .ckctl input[type=range] { width:140px; accent-color:var(--accent); }
  .ckctl .seg button { padding:14px 18px; border-radius:0; }
  /* Ansicht „Fläche“: ein großes Feld blinkt, sonst nichts */
  .ckflash { position:relative; height:calc(100dvh - 250px); min-height:240px; border-radius:22px; background:var(--panel);
    margin:0 0 16px; overflow:hidden; }
  .ckflash i { position:absolute; inset:0; opacity:0; background:var(--fg); }
  .ckflash.one i { background:var(--accent); }
  /* schwarze Schlagzahl: nur sichtbar, solange die Fläche leuchtet */
  .ckflash b { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#000;
    font-size:min(42vh, 40vw); font-weight:800; line-height:1; font-variant-numeric:tabular-nums; }

  /* ---------- GRIFFE ---------- */
  .cgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:14px; }
  .ccard { background:var(--panel); border:1px solid transparent; border-radius:14px; padding:12px 8px 8px; text-align:center; }
  .ccard .nm { font-size:24px; font-weight:600; min-height:1.3em; }
  .ccard svg { display:block; width:100%; height:auto; }
  .ccard.add { display:flex; align-items:center; justify-content:center; min-height:220px; background:none;
    border:2px dashed var(--line); color:var(--dim); font-size:20px; }
  .empty { color:var(--dim); margin:0 0 18px; }

  /* ---------- Fenster ---------- */
  .sheet { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.72); padding:20px; }
  .sheet.open { display:flex; }
  .box { background:#111113; border:1px solid var(--line); border-radius:18px; padding:20px;
    width:100%; max-width:880px; max-height:100%; overflow:auto; }
  #editor .box { display:grid; grid-template-columns:minmax(240px, 380px) 1fr; gap:28px; align-items:start; }
  #editor svg { width:100%; height:auto; touch-action:manipulation; }
  #editor .side { display:flex; flex-direction:column; gap:22px; }
  #edName { width:100%; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px;
    font-size:30px; font-weight:600; }
  .btns { display:flex; flex-wrap:wrap; gap:8px; }
  .grow { flex:1; }
  @media (max-width:720px) { #editor .box { grid-template-columns:1fr; } }
  #picker { z-index:20; }
  /* eigene Rückfrage und Meldung – confirm()/alert() zeigen manche In-App-Browser nicht an */
  #ask { z-index:25; }
  #ask .box { max-width:540px; }
  #ask p { margin:0 0 20px; font-size:19px; line-height:1.45; }
  #ask .btns { justify-content:flex-end; }
  #ask .btns button { font-size:18px; padding:12px 20px; }
  #toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 20px); transform:translateX(-50%); z-index:30;
    max-width:min(92vw, 640px); background:var(--panel2); border:1px solid var(--line); border-radius:14px; padding:14px 18px;
    font-size:17px; line-height:1.4; box-shadow:0 10px 40px rgba(0,0,0,.5); display:none; }
  #toast.show { display:block; }
  #picker .box { max-width:520px; }
  #picker h3 { margin:0 0 14px; font-size:15px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); }
  .pgrid { display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; }
  .pgrid button { height:58px; padding:0; font-size:22px; font-weight:500; }
  .pgrid button.x { color:var(--mute); }
  .pgrid button.wide { grid-column:span 2; font-size:17px; }
  .pgrid button.on { background:var(--accent); border-color:var(--accent); color:#000; }
  #textbox textarea { min-height:40vh; font:15px/1.45 ui-monospace,Menlo,monospace; white-space:pre; }

  /* ---------- TABS ---------- */
  .tabblock { background:var(--panel); border-radius:14px; padding:12px 0 14px; margin:0 0 18px; }
  .tabhead { display:flex; align-items:center; gap:8px; padding:0 14px 10px; }
  .tabhead input { flex:1; min-width:0; background:none; border:0; border-bottom:1px solid transparent; padding:6px 2px;
    font-size:22px; font-weight:600; }
  .tabhead input:focus { outline:none; border-bottom-color:var(--line); }
  .staff { display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch; padding:0 14px 6px; }
  .names { flex:none; position:sticky; left:-14px; z-index:1; background:var(--panel); padding:0 8px 0 0; }
  .names div, .tcol .c { height:40px; display:flex; align-items:center; justify-content:center; }
  .names div { width:24px; color:var(--dim); font-size:15px; font-weight:600; }
  .names .hd, .tcol .hd { height:24px; }
  .tcol { flex:none; width:46px; }
  .tcol .hd { display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--dim); }
  .tcol .cells { border-left:2px solid transparent; }
  .names + .tcol .cells, .tcol.bar + .tcol .cells { border-left-color:#77777d; }
  .tcol:last-child .cells { border-right:2px solid #77777d; }
  .tcol .c { position:relative; }
  .tcol .c::before { content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:var(--string); }
  .tcol .c span { position:relative; min-width:30px; height:30px; padding:0 6px; border-radius:15px; background:var(--panel);
    display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:600; }
  .tcol .c span.x { color:var(--mute); }
  /* Hammer/Pull: Bogen von Note zu Note, Slide: schräge Linie dazwischen, Bend/Vibrato über der Note */
  .tcol .c .lg { position:absolute; top:1px; height:10px; border:2px solid var(--accent); border-bottom:0;
    border-radius:50% 50% 0 0 / 100% 100% 0 0; }
  .tcol .c .lg b { position:absolute; left:50%; top:-9px; transform:translateX(-50%); padding:0 3px; background:var(--panel);
    font:italic 700 13px/1 -apple-system,Helvetica,sans-serif; color:var(--accent); }
  .tcol .c .sl { position:absolute; top:50%; height:2.5px; background:var(--accent); border-radius:2px; }
  .tcol .c .fx { position:absolute; left:50%; top:-4px; margin-left:6px; z-index:1; white-space:nowrap;
    font:700 13px/1 -apple-system,Helvetica,sans-serif; color:var(--accent); }
  .tabmode { display:flex; justify-content:flex-end; margin:0 0 12px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { border:0; border-radius:0; font-size:15px; padding:7px 16px; background:none; }
  .seg button.on { background:var(--accent); color:#000; font-weight:600; }
  .ptech { display:flex; flex-wrap:wrap; gap:8px; margin:0 0 14px; }
  .ptech .cap { flex-basis:100%; margin:0; }
  .ptech button { flex:1; font-size:16px; padding:10px 6px; }
  .ptech button.on { background:var(--accent); border-color:var(--accent); color:#000; font-weight:600; }
  .tcol.sel { background:rgba(198,255,61,.08); }
  .tcol.sel .hd { color:var(--accent); font-weight:700; }
  .tabtools { display:flex; flex-wrap:wrap; gap:8px; padding:10px 14px 0; }
  .tabtools button { font-size:15px; padding:7px 12px; }
</style>
</head>
<body class="listing" data-page="text">
<header>
  <div class="row">
    <div class="midi"><div class="dot" id="dot"></div><span id="midiText">MIDI</span></div>
    <h1 id="title">Songs</h1>
    <span class="meta" id="meta"></span>
    <button class="clickbtn flbtn" id="clickBtn" aria-label="Click an/aus"><i class="fl"></i><span>Click</span></button>
    <div class="size"><button id="smaller" aria-label="Schrift kleiner">A−</button><button id="bigger" aria-label="Schrift größer">A+</button><button id="editText">Bearbeiten</button></div>
    <button id="toggleList">Songs</button>
  </div>
  <nav class="pages" id="pages">
    <button data-p="text">TEXT</button><button data-p="info">INFO</button><button data-p="map">SONGMAP</button>
    <button data-p="chords">GRIFFE</button><button data-p="tabs">TABS</button><button data-p="click">CLICK</button>
  </nav>
</header>

<div id="scroll">
<div id="list">
  <div class="tools">
    <button id="load">Laden …</button>
    <button id="backup">Sichern</button>

<main class="page" id="pText"></main>
<div class="page" id="pInfo"></div>

</div>

<div class="sheet" id="editor"><div class="box"></div></div>
<div class="sheet" id="picker"><div class="box"><h3></h3><div class="ptech"></div><div class="pgrid"></div></div></div>
<div class="sheet" id="ask"><div class="box"><p id="askText"></p>
  <div class="btns"><button id="askNo">Abbrechen</button><button class="primary" id="askYes">OK</button></div></div></div>

  <div class="tabhead" style="padding:0 0 12px"><b class="grow">Text bearbeiten</b>
    <button class="danger" id="lyOrig">Original wiederherstellen</button><button id="lyCancel">Abbrechen</button>
    <button class="primary" id="lyDone">Fertig</button></div>
  <textarea id="lyText" autocapitalize="sentences" spellcheck="false"></textarea>
  <p class="hint">Jeder Teil beginnt mit seinem Namen in eckigen Klammern, z. B. [Strophe] oder [Refrain] – danach die Zeilen.
    Szenen vom MC8 springen zum Teil, dessen Name so anfängt.</p>
</div></div>
<div class="sheet" id="textbox"><div class="box">
  <div class="tabhead" style="padding:0 0 12px"><b class="grow" id="tbTitle"></b><button id="tbCopy">Kopieren</button>
    <button id="tbSave">Als Datei</button><button class="primary" id="tbClose">Fertig</button></div>
  <textarea id="tbText" readonly></textarea>
</div></div>

<script>
const $ = (id) => document.getElementById(id);
const STORE = "stage-songs-v1", DATA = "stage-data-v1";
const CH = 16, SCENE_CC = 20;
let songs = [];      // aus den Dateien: {nr, title, tempo, key, scenes[], info[[k, v]], sections[{label, lines[]}]}
let data = { v: 1, songs: {} };   // am iPad gebaut: Griffe, Tabs, Notizen pro Song
let current = null;  // Index in songs
let section = 0;
let page = "text";

// ---------- Speicher ----------
function save() { try { localStorage.setItem(STORE, JSON.stringify(songs)); } catch (e) {} }
let saveTimer = null;
function saveData() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(DATA, JSON.stringify(data)); } catch (e) {} }, 300);
}
function restore() {
  try { songs = JSON.parse(localStorage.getItem(STORE) || "[]"); } catch (e) { songs = []; }
  songs.forEach(s => { s.info = s.info || []; s.scenes = s.scenes || []; s.sections = s.sections || []; });   // ältere App-Versionen
  try { data = JSON.parse(localStorage.getItem(DATA) || "") || data; } catch (e) {}
  if (!data.songs) data.songs = {};
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
}
function setting(key, value) {
  try { if (value === undefined) return localStorage.getItem(key); localStorage.setItem(key, value); } catch (e) {}
}
const songKey = (s) => s.title.toLowerCase().replace(/[^a-z0-9äöüß]+/g, " ").trim();
function ud() {   // Daten des aktuellen Songs
  const k = songKey(songs[current]);
  return data.songs[k] || (data.songs[k] = { updated: 0, guitar: "", tuning: "std", capo: 0, notes: "", chords: [], tabs: [] });
}
function touch() { ud().updated = Date.now(); saveData(); }
const val = (k, fileVal) => { const u = ud(); return u[k] !== undefined ? u[k] : fileVal; };   // eigener Eintrag vor Datei
const sceneName = (n) => val("scene" + n, songs[current].scenes[n] || "");

// ---------- ChordPro / Text einlesen ----------
const KIND = { start_of_verse:1, sov:1, start_of_chorus:1, soc:1, start_of_bridge:1, sob:1, start_of_part:1 };
const INFO_KEYS = { capo:"Capo", artist:"Interpret", time:"Takt", duration:"Dauer", composer:"Komponist" };
function parse(name, text) {
  const nrMatch = name.match(/^(\d+)/);
  const song = { nr: nrMatch ? parseInt(nrMatch[1], 10) : 0, title: name.replace(/^\d+[_ -]*/, "").replace(/\.[^.]+$/, ""),
                 tempo: "", key: "", scenes: [], info: [], sections: [] };
  let sec = null;
  const open = (label) => { sec = { label, lines: [] }; song.sections.push(sec); };
  for (const raw of text.replace(/\r/g, "").split("\n")) {
    const line = raw.replace(/\s+$/, "");
    const dir = line.match(/^\s*\{\s*([a-z_]+)\s*(?::\s*(.*?))?\s*\}\s*$/i);
    if (dir) {
      const k = dir[1].toLowerCase(), v = dir[2] || "";
      if (k === "title" || k === "t") song.title = v;
      else if (k === "tempo") song.tempo = v;
      else if (k === "key") song.key = v;
      else if (k === "meta" && v.startsWith("mc8scenes")) song.scenes = v.replace("mc8scenes", "").trim().split("|");
      else if (k === "meta") { const m = v.match(/^(\S+)\s+(.*)$/); if (m) song.info.push([m[1], m[2]]); }
      else if (INFO_KEYS[k]) song.info.push([INFO_KEYS[k], v]);
      else if (KIND[k]) open(v || k.replace(/^start_of_|^so/, "").replace("v", "verse").replace("c", "chorus").replace("b", "bridge"));
      else if (k.startsWith("end_of") || ["eov", "eoc", "eob"].includes(k)) sec = null;
      else if ((k === "comment" || k === "c") && !/^MC8 Song/.test(v)) open(v);
      continue;
    }
    const tag = line.match(/^\s*\[([^\]]+)\]\s*$/);       // [Verse] im Klartext-Format
    if (tag && !/^[A-G][#b]?(m|maj|min|sus|dim|aug|\d)*$/.test(tag[1])) { open(tag[1]); continue; }
    if (!sec) { if (!line.trim()) continue; open(""); }
    sec.lines.push(line.replace(/\[[^\]]*\]/g, ""));    // Akkorde in [ ] ausblenden
  }
  song.sections.forEach(s => { while (s.lines.length && !s.lines[s.lines.length - 1].trim()) s.lines.pop(); });
  song.sections = song.sections.filter(s => s.label || s.lines.some(l => l.trim()));
  return song;
}
function mergeSongs(loaded) {
  const byNr = new Map(songs.map(s => [s.nr + "|" + s.title, s]));
  loaded.forEach(s => byNr.set(s.nr + "|" + s.title, s));
  songs = [...byNr.values()].sort((a, b) => a.nr - b.nr || a.title.localeCompare(b.title));
  save();
}

// Laden: Songtexte (.chopro/.txt) oder eine Sicherung (.json) – am Inhalt erkannt
$("load").onclick = () => $("file").click();
$("file").onchange = async (e) => {
  const files = [...e.target.files];
  if (!files.length) return;
  const loaded = [];
  let restored = 0, suggested = null, audio = 0, replaced = 0, declined = false;
  const unmatched = [], isAudio = (f) => /^audio\//.test(f.type) || /\.(mp3|m4a|wav|aac)$/i.test(f.name);
  files.sort((a, b) => isAudio(a) - isAudio(b));   // Audio zuletzt – Vorschläge legen evtl. erst die Songs an
  toast("Lädt …", 120000);
  try {
  for (const f of files) {
    if (isAudio(f)) {   // Song-Audio: per Dateiname dem Song zuordnen
      const key = songKey({ title: f.name.replace(/\.[^.]+$/, "") });
      if (songs.some(x => songKey(x) === key)) {
        try { await idb.put(key, { blob: f, name: f.name }); audio++; if (pl.key === key) pl.key = null; } catch (err) { unmatched.push(f.name); }
      } else unmatched.push(f.name);
      continue;
    }
    if (await f.slice(0, 17).text() === "STAGEHAND-AUDIO1\n") {   // Audio-Paket: viele Songs in einer Datei
      const r = await importAudioPack(f); audio += r.saved; unmatched.push(...r.unmatched);
      continue;
    }
    const text = await f.text();
    let backup = null;
    try { backup = JSON.parse(text); } catch (err) {}
    // „buehne“ = Sicherungen vor der Umbenennung in Stagehand
    if (backup && backup.app === "stagehand" && backup.kind === "komplett") {   // ersetzt alles – nur nach Rückfrage
      if (await ask(`Alle Songs und alles Eingetragene (Griffe, Tabs, Notizen, Songmaps, Favoriten) durch diesen Stand ersetzen? ` +
                    `${backup.songs.length} Songs. Geladene Song-Audios bleiben.`, "Alles ersetzen")) {
        songs = backup.songs.map(x => parse(x.name, x.text));
        songs.sort((a, b) => a.nr - b.nr || a.title.localeCompare(b.title));
        data = backup.data; save(); saveData(); current = null; replaced = songs.length;
      } else declined = true;
    }
    else if (backup && backup.app === "stagehand" && backup.kind === "vorschlag") { suggested = importSuggestion(backup); }
    else if (backup && (backup.app === "stagehand" || backup.app === "buehne")) { importBackup(backup); restored++; }
    else loaded.push(parse(f.name, text));
  }
  } catch (err) { toast("Fehler beim Laden: " + (err && err.message || err), 10000); e.target.value = ""; return; }
  if (loaded.length) mergeSongs(loaded);
  renderList();
  const msg = [loaded.length ? loaded.length + " Song(s) geladen." : "",
                           restored ? "Sicherung geladen." : "",
                           replaced ? `Komplett ersetzt: ${replaced} Songs.` : "",
                           suggested ? `Vorschläge: ${suggested.filled} Song(s) ergänzt, ${suggested.added} neu angelegt – Vorhandenes bleibt.` : "",
                           audio ? `${audio} Song-Audio(s) gespeichert.` : "",
                           unmatched.length ? `Ohne passenden Song: ${unmatched.join(", ")}` : "",
                           declined ? "Ersetzen abgebrochen – nichts geändert." : ""].filter(Boolean).join(" ");
  $("hint").textContent = msg;
  toast(msg || "Nichts geladen – Datei nicht erkannt.", 7000);
  e.target.value = "";
};
// Rückfrage im eigenen Fenster (Promise: true = bestätigt) und Meldungsleiste unten
function ask(text, yes) {
  return new Promise((res) => {
    $("toast").classList.remove("show");
    $("askText").textContent = text; $("askYes").textContent = yes || "OK";
    const done = (v) => { $("ask").classList.remove("open"); res(v); };
    $("askYes").onclick = () => done(true); $("askNo").onclick = () => done(false);
    $("ask").classList.add("open");
  });
}
let toastTimer = 0;
function toast(msg, ms) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), ms || 6000);
}
$("toast").onclick = () => $("toast").classList.remove("show");
function importBackup(b) {
  if (Array.isArray(b.songs)) mergeSongs(b.songs);
  for (const [k, v] of Object.entries((b.data && b.data.songs) || {})) {
    if (!data.songs[k] || (v.updated || 0) >= (data.songs[k].updated || 0)) data.songs[k] = v;   // neuere Fassung gewinnt
  }
  saveData();
}

// Audio-Paket (suno/audio.py): Kennung, eine Zeile Inhaltsverzeichnis (JSON), dann die MP3s hintereinander
async function importAudioPack(f) {
  const head = await f.slice(0, 1 << 20).arrayBuffer(), bytes = new Uint8Array(head);
  const nl = bytes.indexOf(10, 17);
  const index = JSON.parse(new TextDecoder().decode(bytes.slice(17, nl)));
  let pos = nl + 1, saved = 0;
  const unmatched = [];
  for (const t of index.tracks) {
    const key = songKey({ title: t.title }), blob = f.slice(pos, pos + t.size, "audio/mpeg");
    pos += t.size;
    if (!songs.some(x => songKey(x) === key)) { unmatched.push(t.title); continue; }
    try { await idb.put(key, { blob: new Blob([await blob.arrayBuffer()], { type: "audio/mpeg" }), name: t.name }); saved++; if (pl.key === key) pl.key = null; }
    catch (err) { unmatched.push(t.title); continue; }
    if (t.grid) {   // Fassung mit konstantem Tempo (konstant_pack.py): Raster und Tempo gehören zur Datei, Versatz entfällt
      const d = data.songs[key] || (data.songs[key] = { updated: 0, guitar: "", tuning: "std", capo: 0, notes: "", chords: [], tabs: [] });
      d.grid = t.grid; d.gridSrc = t.gridSrc; d.tempo = String(t.tempo); delete d.audioShift; d.updated = Date.now();
      if (t.map) d.map = t.map;   // Songmap auf bereinigte Takte (Sunos Raster war unregelmäßig)
    }
  }
  saveData();
  return { saved, unmatched };
}

// Vorschlagsdatei (z. B. aus Suno): Tempo, Takt, Songmap, Taktraster, Liedtext – nur dort, wo noch nichts eingetragen ist
function importSuggestion(b) {
  let added = 0, filled = 0;
  for (const s of b.songs || []) {
    const key = songKey(s);
    let song = songs.find(x => songKey(x) === key);
    if (!song) { song = { nr: s.nr || 0, title: s.title, tempo: "", key: "", scenes: [], info: [], sections: [] }; songs.push(song); added++; }
    const d = data.songs[key] || (data.songs[key] = { updated: 0, guitar: "", tuning: "std", capo: 0, notes: "", chords: [], tabs: [] });
    let changed = false;
    if (!d.tempo && !song.tempo && s.tempo) { d.tempo = String(s.tempo); changed = true; }
    const takt = [...(song.info || []), ...(d.fields || []).map(f => [f.k, f.v])].some(([k]) => /^takt$/i.test(String(k).trim()));
    if (!takt && s.time) { (d.fields = d.fields || []).push({ k: "Takt", v: s.time }); changed = true; }
    if (!(d.map && d.map.length) && s.map) { d.map = s.map; changed = true; }
    if (!d.grid && s.grid) { d.grid = s.grid; changed = true; }
    if (s.text && !(song.sections || []).length && typeof d.text !== "string") {   // Liedtext nur, wo noch keiner ist
      song.sections = parse("x.txt", s.text).sections; changed = true;
    }
    if (changed) { d.updated = Date.now(); filled++; }
  }
  songs.sort((a, b) => a.nr - b.nr || a.title.localeCompare(b.title));
  save(); saveData();
  return { added, filled };
}

// ---------- Sichern ----------
$("backup").onclick = async () => {
  const day = new Date().toISOString().slice(0, 10);
  const name = "stagehand-" + day + ".json";
  const out = JSON.parse(JSON.stringify(data));      // Akkordnamen mitschreiben, damit sie am Mac lesbar sind
  for (const d of Object.values(out.songs))
    (d.chords || []).forEach(c => c.label = c.auto ? nameChord(c.frets, (TUNINGS[d.tuning] || TUNINGS.std)[1]) : c.name);
  const json = JSON.stringify({ app: "stagehand", v: 1, saved: new Date().toISOString(), songs, data: out });
  const file = new File([json], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); return; }
  } catch (e) { if (e.name === "AbortError") return; }
  showText("Sicherung " + day, json, name);
};

// ---------- Textfenster (Sicherung, Tab als Text) ----------
let tbName = "";
function showText(title, text, fileName) {
  $("tbTitle").textContent = title; $("tbText").value = text; tbName = fileName;
  $("textbox").classList.add("open");
}
$("tbClose").onclick = () => $("textbox").classList.remove("open");
$("tbCopy").onclick = async () => {
  const t = $("tbText");
  try { await navigator.clipboard.writeText(t.value); $("tbCopy").textContent = "Kopiert ✓"; }
  catch (e) { t.removeAttribute("readonly"); t.focus(); t.select(); t.setAttribute("readonly", ""); }
  setTimeout(() => $("tbCopy").textContent = "Kopieren", 1500);
};
$("tbSave").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([$("tbText").value], { type: "application/octet-stream" }));
  a.download = tbName; document.body.appendChild(a); a.click(); a.remove();
};

// ---------- Musik ----------
const NOTE = ["C", "C#", "D", "Eb", "E", "F", "F#", "G", "Ab", "A", "Bb", "B"];
const TUNINGS = {
  std:   ["Standard (E A D G B E)", [40, 45, 50, 55, 59, 64]],
  dropd: ["Drop D (D A D G B E)",   [38, 45, 50, 55, 59, 64]],
  eb:    ["Halbton tiefer (Eb)",    [39, 44, 49, 54, 58, 63]],
  d:     ["Ganzton tiefer (D)",     [38, 43, 48, 53, 57, 62]],
  dadgad:["DADGAD",                 [38, 45, 50, 55, 57, 62]],
  openg: ["Open G (D G D G B D)",   [38, 43, 50, 55, 59, 62]],
  bass6: ["Bass VI (E A D G B E, Oktave tiefer)", [28, 33, 38, 43, 47, 52]],
};
const GUITARS = ["SG", "Charger", "SixGun", "Firebird", "Sheraton", "Tele", "Bass VI"];
const tuning = () => (TUNINGS[ud().tuning] || TUNINGS.std)[1];
function stringNames(t) {
  const n = t.map(m => NOTE[m % 12]);
  if (n[5] === n[0]) n[5] = n[5].toLowerCase();
  return n;
}

// Akkordname aus den gegriffenen Tönen: alle Grundtöne durchprobieren, einfachster Name gewinnt
const CHORDS = [
  ["", [0,4,7]], ["m", [0,3,7]], ["5", [0,7]], ["dim", [0,3,6]], ["aug", [0,4,8]], ["sus2", [0,2,7]], ["sus4", [0,5,7]],
  ["7", [0,4,7,10]], ["maj7", [0,4,7,11]], ["m7", [0,3,7,10]], ["m7b5", [0,3,6,10]], ["dim7", [0,3,6,9]],
  ["6", [0,4,7,9]], ["m6", [0,3,7,9]], ["add9", [0,2,4,7]], ["madd9", [0,2,3,7]], ["7sus4", [0,5,7,10]],
  ["m(maj7)", [0,3,7,11]], ["add11", [0,4,5,7]], ["madd11", [0,3,5,7]], ["9", [0,2,4,7,10]], ["maj9", [0,2,4,7,11]],
  ["m9", [0,2,3,7,10]], ["6/9", [0,2,4,7,9]], ["7b9", [0,1,4,7,10]], ["7#9", [0,3,4,7,10]], ["7b5", [0,4,6,10]],
  ["aug7", [0,4,8,10]], ["maj7#11", [0,4,6,7,11]], ["11", [0,2,5,7,10]], ["m11", [0,2,3,5,7,10]], ["13", [0,2,4,7,9,10]],
].map(([suffix, ints], i) => ({ suffix, i, mask: ints.reduce((m, n) => m | 1 << n, 0), fifth: ints.includes(7) && ints.length >= 4 }));
function chordNotes(frets, t) {
  return frets.map((f, s) => typeof f === "number" ? (t[s] + f) % 12 : null).filter(p => p !== null);
}
function nameChord(frets, t) {
  const pcs = chordNotes(frets, t);
  if (!pcs.length) return "";
  const bass = pcs[0], set = [...new Set(pcs)];
  if (set.length === 1) return NOTE[bass];
  let best = null;
  for (const root of set) {
    const variants = [[set, 0]];
    if (root !== bass && set.length > 2) variants.push([set.filter(p => p !== bass), 3]);   // Bass nur als Slash
    for (const [notes, slashCost] of variants) {
      const mask = notes.reduce((m, p) => m | 1 << ((p - root + 12) % 12), 0);
      for (const c of CHORDS) {
        let cost = null;
        if (c.mask === mask) cost = 0;
        else if (c.fifth && (c.mask & ~(1 << 7)) === mask) cost = 6;                     // ohne Quinte
        if (cost === null) continue;
        cost += c.i * 0.3 + (root !== bass ? 4 + slashCost : 0);
        if (!best || cost < best.cost) best = { cost, name: NOTE[root] + c.suffix + (root !== bass ? "/" + NOTE[bass] : "") };
      }
    }
  }
  return best ? best.name : "";
}
const chordName = (c) => c.auto ? nameChord(c.frets, tuning()) : c.name;
function autoBase(frets) {
  const f = frets.filter(n => typeof n === "number" && n > 0);
  return !f.length || Math.max(...f) <= 5 ? 1 : Math.min(...f);
}
const baseOf = (c) => c.base || autoBase(c.frets);

// ---------- Griffbild (SVG) ----------
const svgEsc = (t) => String(t).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
function chordSVG(c, interactive) {
  const X0 = 40, DX = 44, Y0 = 34, DY = 56, FR = 5, CY = Y0 + DY * FR + 46, R = 18;
  const base = baseOf(c), x = (s) => X0 + s * DX;
  let g = "";
  g += base === 1 ? `<rect x="${X0 - 2}" y="${Y0 - 9}" width="${DX * 5 + 4}" height="10" fill="var(--fg)"/>`
                  : `<line x1="${X0}" y1="${Y0}" x2="${X0 + DX * 5}" y2="${Y0}" stroke="var(--fg)" stroke-width="1.5"/>
                     <text x="${X0 - 10}" y="${Y0 + DY / 2 + 9}" text-anchor="end" font-size="26" font-weight="600" fill="var(--fg)">${base}</text>`;
  for (let r = 1; r <= FR; r++) g += `<line x1="${X0}" y1="${Y0 + r * DY}" x2="${X0 + DX * 5}" y2="${Y0 + r * DY}" stroke="var(--fg)" stroke-width="1.5"/>`;
  c.frets.forEach((f, s) => {
    const muted = f === "x";
    g += `<line x1="${x(s)}" y1="${Y0}" x2="${x(s)}" y2="${CY - R}" stroke="${muted ? "var(--mute)" : "var(--fg)"}" stroke-width="${muted ? 2.5 : 1.5}"/>`;
    if (typeof f === "number" && f >= base && f < base + FR)
      g += `<circle cx="${x(s)}" cy="${Y0 + (f - base) * DY + DY / 2}" r="16" fill="var(--fg)"/>`;
    g += `<g ${interactive ? `data-pick="${s}" style="cursor:pointer"` : ""}>
            <circle cx="${x(s)}" cy="${CY}" r="${R}" fill="${muted ? "var(--mute)" : "var(--bg)"}" stroke="${muted ? "var(--mute)" : "var(--fg)"}" stroke-width="1.5"/>
            <text x="${x(s)}" y="${CY + 7}" text-anchor="middle" font-size="19" fill="#fff">${muted ? "X" : f}</text></g>`;
  });

      g += `<rect data-s="${s}" data-f="${base + r}" x="${x(s) - DX / 2}" y="${Y0 + r * DY}" width="${DX}" height="${DY}" fill="transparent" style="cursor:pointer"/>`;
  return `<svg viewBox="0 0 ${X0 * 2 + DX * 5} ${CY + R + 6}" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Helvetica,sans-serif">${g}</svg>`;

// TEXT

$("pInfo").addEventListener("click", (e) => {

// Skizze: Striche als Punkte (relativ zur Breite) – bleibt bei jeder Bildschirmgröße scharf
const PENS = ["#f2f2f2", "#c6ff3d", "#e5392b", "#4db8ff", "#ffb02e"];
const sk = { on: false, color: PENS[0], erase: false, sawPen: false, cur: null };
const sketchData = () => { const u = ud(); return u.sketch || (u.sketch = { h: 0.6, strokes: [] }); };
function sizeSketch() {
  const cv = $("sketch");
  if (!cv) return;
  const w = cv.clientWidth, dpr = window.devicePixelRatio || 1;
  cv.style.height = Math.round(w * sketchData().h) + "px";
  cv.width = Math.round(w * dpr); cv.height = Math.round(w * sketchData().h * dpr);
  drawSketch();
}
function drawStroke(ctx, st, W, from = 1) {
  ctx.strokeStyle = st.c; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const p = st.p;
  if (p.length === 3) { ctx.fillStyle = st.c; ctx.beginPath(); ctx.arc(p[0] * W, p[1] * W, st.w * W * (0.4 + p[2]) / 2, 0, 7); ctx.fill(); return; }
  for (let i = Math.max(1, from); i < p.length / 3; i++) {
    ctx.lineWidth = st.w * W * (0.4 + p[i * 3 + 2]);
    ctx.beginPath(); ctx.moveTo(p[i * 3 - 3] * W, p[i * 3 - 2] * W); ctx.lineTo(p[i * 3] * W, p[i * 3 + 1] * W); ctx.stroke();
  }
}
function drawSketch() {
  const cv = $("sketch"), ctx = cv.getContext("2d");
  ctx.clearRect(0, 0, cv.width, cv.height);
  sketchData().strokes.forEach(st => drawStroke(ctx, st, cv.width));
}
function skPoint(e, cv) {
  const r = cv.getBoundingClientRect(), r4 = (n) => Math.round(n * 10000) / 10000;
  return [r4((e.clientX - r.left) / r.width), r4((e.clientY - r.top) / r.width),
          e.pointerType === "pen" ? r4(e.pressure || 0.5) : 0.5];
}
function skErase(pt) {
  const d = sketchData(), n = d.strokes.length;
  d.strokes = d.strokes.filter(st => {
    for (let i = 0; i < st.p.length; i += 3) if (Math.hypot(st.p[i] - pt[0], st.p[i + 1] - pt[1]) < 0.02) return false;
    return true;
  });
  if (d.strokes.length !== n) { drawSketch(); touch(); }
}
$("pInfo").addEventListener("pointerdown", (e) => {
  const cv = e.target.closest("#sketch");
  if (!cv || !sk.on) return;
  if (e.pointerType === "pen") sk.sawPen = true;
  if (sk.sawPen && e.pointerType === "touch") return;          // Handballen ignorieren, sobald ein Stift im Spiel ist
  e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  if (sk.erase) { sk.cur = "erase"; skErase(skPoint(e, cv)); return; }
  sk.cur = { c: sk.color, w: 0.005, p: skPoint(e, cv) };
  drawStroke(cv.getContext("2d"), sk.cur, cv.width);
});
$("pInfo").addEventListener("pointermove", (e) => {
  const cv = e.target.closest("#sketch");
  if (!cv || !sk.cur) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of evs.length ? evs : [e]) {
    const pt = skPoint(ev, cv);
    if (sk.cur === "erase") { skErase(pt); continue; }
    sk.cur.p.push(...pt);
    drawStroke(cv.getContext("2d"), sk.cur, cv.width, sk.cur.p.length / 3 - 1);
  }
});
const skEnd = () => {
  if (sk.cur && sk.cur !== "erase") { sketchData().strokes.push(sk.cur); touch(); }
  sk.cur = null;
};
$("pInfo").addEventListener("pointerup", skEnd);
$("pInfo").addEventListener("pointercancel", skEnd);
window.addEventListener("resize", () => { if (page === "info") sizeSketch(); });

let edIdx = 0;

function renderEditor() {

      <div><span class="cap">Lage (erster Bund im Bild)</span><div class="stepper">

function setFret(s, f) {

  touch(); renderEditor();
}
$("editor").onclick = (e) => {
  if (e.target === e.currentTarget) { closeEditor(); return; }
  const u = ud(), c = u.chords[edIdx], t = tuning(), names = stringNames(t);
  const cell = e.target.closest("[data-s]"), circ = e.target.closest("[data-pick]");
  if (cell) { const s = +cell.dataset.s, f = +cell.dataset.f; setFret(s, c.frets[s] === f ? 0 : f); return; }
  if (circ) { const s = +circ.dataset.pick; pick("Saite " + names[s] + " – Bund", ["x", ...FRETS], c.frets[s], (v) => setFret(s, v)); return; }
  const b = e.target.closest("button");

// SONGMAP: Ablauf des Songs in Teilen – Name, Takte, Wiederholungen, Akkorde, Hinweis
const PARTS = ["Intro", "Strophe", "Pre", "Refrain", "Bridge", "Solo", "Break", "Outro"];
const PART_COLORS = [[/intro|outro|ende|end/, "#9aa5b1"], [/strophe|verse|vers/, "#4db8ff"], [/pre/, "#ffb02e"],
  [/refrain|chorus|hook/, "#c6ff3d"], [/bridge|c-teil/, "#b48cff"], [/solo/, "#ff6b5e"], [/break|zwischen|inter/, "#2ec4b6"]];
// eigene Farbe des Teils, sonst Standardfarbe nach dem Namen
const partColor = (p) => p.color || (PART_COLORS.find(([re]) => re.test((p.name || "").toLowerCase())) || [0, "#8a8a92"])[1];
// Taktart aus dem Feld „Takt“ (Datei oder eigenes Feld), sonst 4/4. Schläge = worauf sich das Tempo bezieht:
// x/4 in Vierteln, 6/8 · 9/8 · 12/8 in punktierten Vierteln, andere x/8 in Vierteln (halbe Zahl)
function timeSig() {
  const s = songs[current], f = [...(s.info || []), ...(ud().fields || []).map(x => [x.k, x.v])]
    .find(([k]) => /^takt$/i.test(k.trim()));
  const m = f && String(f[1]).match(/(\d+)\s*\/\s*(\d+)/);
  const num = m ? +m[1] : 4, den = m ? +m[2] : 4;
  const beats = den === 8 ? (num % 3 === 0 && num > 3 ? num / 3 : Math.max(1, Math.round(num / 2))) : num;
  return { num, den, beats };
}

$("pMap").addEventListener("click", (e) => {

  const go = e.target.closest("[data-goto]");
  if (go) {   // mit Audio: dorthin springen, sonst zum Teil scrollen
    e.preventDefault();

    ($("part" + go.dataset.goto) || $("glab" + go.dataset.goto)).scrollIntoView({ behavior: "smooth", block: "center" }); return;

    case "nocolor": delete p.color; break;
    case "bars": p.bars = Math.max(1, Math.min(64, p.bars + +b.dataset.d)); break;
    case "rep": p.rep = Math.max(1, Math.min(16, p.rep + +b.dataset.d)); break;
    case "up": map.splice(i - 1, 0, map.splice(i, 1)[0]); break;
    case "down": map.splice(i + 1, 0, map.splice(i, 1)[0]); break;

async function loadTrack() {

  plStop(); pl.key = key; pl.buf = null; pl.offset = 0;
  try {
    const rec = await idb.get(key);
    if (rec && pl.key === key) { pl.loading = true; await plDecode(rec.blob, rec.name); }
  } catch (e) {}

function plStop() {

        const bp = (bar - Math.floor(bar)) * beatsPerBar();
        one = Math.floor(bp) === 0;
        flash = Math.max(0, 1 - (bp % 1) * 2.2) * clickBright() * (one ? 1 : OFFBEAT);

  const total = (ud().map || []).reduce((n, p) => n + p.bars * p.rep, 0);
  if ($("plTime")) $("plTime").textContent = fmt(t) + " / " + fmt(pl.buf.duration);
  const btn = $("plPlay"); if (btn) btn.textContent = pl.playing ? "❚❚ Pause" : "▶ Play";
  const seek = $("plSeek"); if (seek && document.activeElement !== seek) seek.value = t;

    `Takt ${whole + 1} · nach der Songmap`;

  if (here) { const c = $("part" + here.i); if (c) c.classList.add("playing"); }

function plAction(a, b) {

  if (!pl.buf) return;
  if (a === "play") { if (pl.playing) plStop(); else plPlay(); plLast = ""; plDraw(); return; }
  if (a === "start") { plSeek(0); plLast = ""; plDraw(); return; }
  if (a === "click") { pl.click = !pl.click; setting("stage-map-click", pl.click ? "1" : "0"); b.classList.toggle("on", pl.click); pl.sched = plPos(); return; }
  if (a === "sh" || a === "one") {   // Raster gegen das Audio verschieben
    const u = ud(), t = plPos();

    else u.audioShift = Math.round(((u.audioShift || 0) + t - barStart(Math.round(barAtTime(t)))) * 1000) / 1000;

$("pMap").addEventListener("input", (e) => { if (e.target.id === "plSeek" && pl.buf) plScrubTo(+e.target.value); });

// TABS
let tabSel = {};   // gewählter Schritt pro Tab

      });
      $("dot").classList.toggle("on", list.length > 0);
      $("midiText").textContent = list.length ? list.map(i => i.name).join(", ") : "kein MIDI-Gerät";
    };
    try { access.onstatechange = bind; } catch (e) {}
    setInterval(bind, 3000);                         // neu verbundene Geräte erkennen
    bind();
  } catch (e) {
    $("midiText").textContent = "MIDI nicht erlaubt: " + (e && (e.name || "") + " " + (e.message || "")) +
      (window.isSecureContext ? "" : " (keine https-Adresse)");
  }
}

async function keepAwake() { try { if ("wakeLock" in navigator) await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (!document.hidden) keepAwake(); });

restore(); fontSize(0); renderList(); setPage("text"); midi(); keepAwake();
</script>
</body>
</html>
